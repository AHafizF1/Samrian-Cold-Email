services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: samrian-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - samrian-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: samrian-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio-password &&
      mc mb --ignore-existing local/samrian &&
      mc anonymous set none local/samrian
      "

volumes:
  samrian-minio-data:
