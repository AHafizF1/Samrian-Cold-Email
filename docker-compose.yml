services:
  app:
    build:
      context: .
      target: runner
    container_name: samrian-app
    command: bun run start
    env_file:
      - path: .env
        required: false
    environment:
      AUTH_DATABASE_URL: postgres://samrian_auth_runtime:${SAMRIAN_AUTH_DB_PASSWORD:-samrian-auth-local}@postgres:5432/samrian
      APP_DATABASE_URL: postgres://samrian_app_runtime:${SAMRIAN_APP_DB_PASSWORD:-samrian-app-local}@postgres:5432/samrian
      REDIS_URL: redis://redis:6379
      JOB_PROVIDER: bullmq
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: samrian
      S3_FORCE_PATH_STYLE: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'bun -e "fetch(''http://localhost:3000/api/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      target: runner
    container_name: samrian-worker
    command: bun run worker
    env_file:
      - path: .env
        required: false
    environment:
      WORKER_DATABASE_URL: postgres://samrian_worker_runtime:${SAMRIAN_WORKER_DB_PASSWORD:-samrian-worker-local}@postgres:5432/samrian
      REDIS_URL: redis://redis:6379
      JOB_PROVIDER: bullmq
      STORAGE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: samrian
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: samrian-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: samrian
      SAMRIAN_APP_DB_PASSWORD: ${SAMRIAN_APP_DB_PASSWORD:-samrian-app-local}
      SAMRIAN_AUTH_DB_PASSWORD: ${SAMRIAN_AUTH_DB_PASSWORD:-samrian-auth-local}
      SAMRIAN_WORKER_DB_PASSWORD: ${SAMRIAN_WORKER_DB_PASSWORD:-samrian-worker-local}
    volumes:
      - samrian-postgres-data:/var/lib/postgresql/data
      - ./scripts/db/init-roles.sh:/docker-entrypoint-initdb.d/001-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samrian"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: samrian-redis
    command: redis-server --appendonly yes
    volumes:
      - samrian-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: samrian-minio
    profiles: ["minio"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - samrian-minio-data:/data

volumes:
  samrian-postgres-data:
  samrian-redis-data:
  samrian-minio-data:
